# PDAF two-pin firmware-config diagnostic - THROWAWAY.
# Install as /etc/modprobe.d/pdaf-twopin.conf, then reboot.
#
# These must be set at MODULE LOAD time, not afterwards via sysfs: the ISYS
# driver installs the extra CSI-2 route from init_state, which runs once when
# the subdev is registered at probe. Arming later leaves the route absent and
# link validation then fails with EPIPE because the pad has no per-stream
# format.
#
# pdaf_hack_dt is decimal: 48 = 0x30, the data type the Windows driver's own
# descriptors declare for the PAF stream.
#
# Unlike scripts/pdaf-phase0-modprobe.conf, this sets nothing on s5k3j1. That
# file also carried "options s5k3j1 pdaf_paf_out=1", and pdaf_paf_out only ever
# existed on the phase-0 branch - setting an unknown parameter fails the module
# load outright, which would take the camera down rather than arm anything.
#
# Remove this file and reboot to return the machine to normal.
options intel-ipu6-isys pdaf_hack_port=1 pdaf_hack_pad=2 pdaf_hack_vc=0 pdaf_hack_dt=48

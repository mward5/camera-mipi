# PDAF phase-0 experiment - THROWAWAY. Install as /etc/modprobe.d/pdaf-phase0.conf
#
# These have to be set at MODULE LOAD time, not afterwards through sysfs. The
# ISYS driver installs the extra CSI-2 route the PDAF sideband needs from
# init_state, which runs once when the subdev is registered at probe. Arming
# the parameter later leaves that route absent, and link validation then fails
# with EPIPE because the pad has no per-stream format.
#
# Remove this file and reboot to return the machine to normal.
#
# pdaf_hack_dt is decimal: 48 = 0x30, MIPI user-defined type 1.
options intel-ipu6-isys pdaf_hack_port=1 pdaf_hack_pad=2 pdaf_hack_vc=0 pdaf_hack_dt=48
options s5k3j1 pdaf_paf_out=1

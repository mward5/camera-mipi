PACKAGE_NAME="xps9315-2in1-camera"
PACKAGE_VERSION="1.0"

# Real in-tree paths inside the submodules - see scripts/install-custom-modules.sh
# for the plain (non-DKMS) equivalent of these same build commands, and
# README.md's "Layout" section for what each submodule carries.
#
# linux-xps9315-2in1/drivers/media/pci/intel also holds unrelated drivers
# (ipu3-cio2, ivsc) that get built as an unavoidable side effect of Kbuild
# building the whole directory out-of-tree - harmless, just extra compile
# time, and not referenced by any BUILT_MODULE_NAME below.
#
# DKMS runs exactly one MAKE[0] command per build (confirmed against the
# real dkms source, /usr/sbin/dkms: MAKE_MATCH selects *between*
# alternatives, it doesn't chain them) - so all 4 real out-of-tree builds
# have to be one shell command. DKMS evaluates MAKE[0] with `eval`, so
# `&&`-chaining works; only the first "make" gets DKMS's usual
# "-j$parallel_jobs KERNELRELEASE=$kernelver" injected (a string-prefix
# substitution on the whole MAKE[0] value) - the other three still build
# correctly, just without that convenience.
#
# Neither $(pwd) nor a bare relative M= path works here:
#  - $(pwd) is a command substitution, evaluated once when dkms *sources*
#    dkms.conf from the source tree - it bakes in that path, but the
#    actual build later runs against dkms's private build/ copy (dkms
#    cd's there right before eval'ing this command), so real modules get
#    built, just not where DKMS then looks for them (build succeeds,
#    "module not found" failure).
#  - A bare relative M= path resolves relative to `-C ${kernel_source_dir}`
#    (Kbuild's own -C changes directory before M= is resolved), not
#    relative to the shell's cwd at invocation - "external module
#    directory ... does not exist" build failure.
# ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build matches build_dir's
# own real construction in /usr/sbin/dkms and is stable regardless of when
# it's evaluated, since none of those three change between conf-load and
# build time. Confirmed against a real dkms build (all 3 approaches
# tested; only this one produces modules DKMS can actually find).
BUILD_DIR="${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
MAKE[0]="make -C ${kernel_source_dir} M=${BUILD_DIR}/drivers/linux-xps9315-2in1/drivers/media/pci/intel modules && \
	 make -C ${kernel_source_dir} M=${BUILD_DIR}/drivers/linux-xps9315-2in1/drivers/platform/x86/intel/int3472 modules && \
	 make -C ${kernel_source_dir} M=${BUILD_DIR}/drivers/ipu6-drivers drivers/media/i2c/s5k3j1.ko && \
	 make -C ${kernel_source_dir} M=${BUILD_DIR}/drivers/lc898217 modules"
CLEAN[0]="make -C ${kernel_source_dir} M=${BUILD_DIR}/drivers/linux-xps9315-2in1/drivers/media/pci/intel clean; \
	  make -C ${kernel_source_dir} M=${BUILD_DIR}/drivers/linux-xps9315-2in1/drivers/platform/x86/intel/int3472 clean; \
	  make -C ${kernel_source_dir} M=${BUILD_DIR}/drivers/ipu6-drivers clean; \
	  make -C ${kernel_source_dir} M=${BUILD_DIR}/drivers/lc898217 clean"

BUILT_MODULE_NAME[0]="ipu-bridge"
BUILT_MODULE_LOCATION[0]="drivers/linux-xps9315-2in1/drivers/media/pci/intel"
DEST_MODULE_LOCATION[0]="/updates"

BUILT_MODULE_NAME[1]="intel-ipu6-isys"
BUILT_MODULE_LOCATION[1]="drivers/linux-xps9315-2in1/drivers/media/pci/intel/ipu6"
DEST_MODULE_LOCATION[1]="/updates"

BUILT_MODULE_NAME[2]="intel_skl_int3472_tps68470"
BUILT_MODULE_LOCATION[2]="drivers/linux-xps9315-2in1/drivers/platform/x86/intel/int3472"
DEST_MODULE_LOCATION[2]="/updates"

BUILT_MODULE_NAME[3]="s5k3j1"
BUILT_MODULE_LOCATION[3]="drivers/ipu6-drivers/drivers/media/i2c"
DEST_MODULE_LOCATION[3]="/updates"

BUILT_MODULE_NAME[4]="lc898217"
BUILT_MODULE_LOCATION[4]="drivers/lc898217"
DEST_MODULE_LOCATION[4]="/updates"

AUTOINSTALL="yes"
